name: Setup Python project
description: Checkout-ready helper — install Python, optional pip cache, install project deps per caller contract
inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"
  working-directory:
    description: Project root
    required: false
    default: "."
  enable-pip-cache:
    description: Enable pip cache
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python (with pip cache)
      if: inputs.enable-pip-cache == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          ${{ inputs.working-directory }}/pyproject.toml
          ${{ inputs.working-directory }}/requirements*.txt

    - name: Set up Python (no cache)
      if: inputs.enable-pip-cache != 'true'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ -f pyproject.toml ]; then
          if python -c 'import pathlib; d=pathlib.Path("pyproject.toml").read_text(); import re,sys; sys.exit(0 if re.search(r"(?m)^\[project\.optional-dependencies\][\s\S]*?^dev\s*=", d) else 1)'; then
            pip install -e ".[dev]"
          else
            pip install -e .
          fi
        elif [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No pyproject.toml or requirements*.txt; skipping pip install"
        fi
