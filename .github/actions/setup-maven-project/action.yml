name: Setup Maven project
description: Install Temurin JDK with optional Maven cache and verify pom.xml
inputs:
  java-version:
    description: JDK version
    required: false
    default: "21"
  working-directory:
    description: Directory containing pom.xml
    required: false
    default: "."
  enable-maven-cache:
    description: Enable Maven dependency cache
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up JDK (with Maven cache)
      if: inputs.enable-maven-cache == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

    - name: Set up JDK (no cache)
      if: inputs.enable-maven-cache != 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Verify pom.xml
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ ! -f pom.xml ]; then
          echo "Caller contract: pom.xml must exist under working-directory (${{ inputs.working-directory }})"
          exit 1
        fi
