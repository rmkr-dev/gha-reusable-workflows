name: Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project root relative to the repository
        required: false
        type: string
        default: "."
      python-version:
        description: Python version for setup-python
        required: false
        type: string
        default: "3.12"
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 30
      fail-fast:
        description: Fail the job on first non-zero step (disables soft-continue patterns)
        required: false
        type: boolean
        default: true
      enable-pip-cache:
        description: Enable pip cache via actions/setup-python
        required: false
        type: boolean
        default: true
    outputs:
      python-version:
        description: Resolved Python version used for the job
        value: ${{ jobs.test.outputs.python-version }}
      tests-ran:
        description: Whether pytest executed (true/false)
        value: ${{ jobs.test.outputs.tests-ran }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      python-version: ${{ steps.meta.outputs.python-version }}
      tests-ran: ${{ steps.meta.outputs.tests-ran }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.enable-pip-cache && 'pip' || '' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/requirements*.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Caller contract (first match wins):
          # 1. pyproject.toml with optional-dependencies.dev -> pip install -e ".[dev]"
          #    otherwise -> pip install -e .
          # 2. requirements-dev.txt -> pip install -r requirements-dev.txt
          # 3. requirements.txt -> pip install -r requirements.txt
          # 4. otherwise skip install; compileall still runs below
          if [ -f pyproject.toml ]; then
            if python -c 'import pathlib; d=pathlib.Path("pyproject.toml").read_text(); import re,sys; sys.exit(0 if re.search(r"(?m)^\[project\.optional-dependencies\][\s\S]*?^dev\s*=", d) else 1)'; then
              pip install -e ".[dev]"
            else
              pip install -e .
            fi
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No pyproject.toml or requirements*.txt; skipping pip install"
          fi

      - name: Lint or compile
        run: |
          set -euo pipefail
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          elif [ -d src ]; then
            python -m compileall -q src
          else
            # Resilient fallback (e.g. samples/ trees without packaging metadata)
            python -m compileall -q .
          fi

      - name: Test
        id: pytest
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ] || compgen -G "test_*.py" >/dev/null || compgen -G "*_test.py" >/dev/null; then
            python -m pytest -q
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tests found; skipping pytest"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        id: meta
        env:
          PY_VER: ${{ inputs.python-version }}
          TESTS_RAN: ${{ steps.pytest.outputs.ran }}
          FAIL_FAST: ${{ inputs.fail-fast }}
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          echo "python-version=${PY_VER}" >> "$GITHUB_OUTPUT"
          echo "tests-ran=${TESTS_RAN:-false}" >> "$GITHUB_OUTPUT"
          {
            echo "## Python CI summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| working-directory | \`${WD}\` |"
            echo "| python-version | \`${PY_VER}\` |"
            echo "| tests-ran | \`${TESTS_RAN:-false}\` |"
            echo "| fail-fast | \`${FAIL_FAST}\` |"
            echo "| pip-cache | \`${{ inputs.enable-pip-cache }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
