name: Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project root relative to the repository
        required: false
        type: string
        default: "."
      python-version:
        description: Python version for setup-python
        required: false
        type: string
        default: "3.12"
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 30
      fail-fast:
        description: When true, pass pytest -x to stop on first test failure
        required: false
        type: boolean
        default: true
      enable-pip-cache:
        description: Enable pip cache via actions/setup-python
        required: false
        type: boolean
        default: true
      pytest-args:
        description: Extra arguments appended to `python -m pytest -q` when tests run
        required: false
        type: string
        default: ""
      ruff-args:
        description: Extra arguments appended to `ruff check` when ruff is available
        required: false
        type: string
        default: ""
      fetch-depth:
        description: actions/checkout fetch-depth (0 = full history)
        required: false
        type: number
        default: 1
    outputs:
      python-version:
        description: Resolved Python version used for the job
        value: ${{ jobs.test.outputs.python-version }}
      tests-ran:
        description: Whether pytest executed (true/false)
        value: ${{ jobs.test.outputs.tests-ran }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      python-version: ${{ steps.meta.outputs.python-version }}
      tests-ran: ${{ steps.meta.outputs.tests-ran }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Python project
        uses: rmkr-dev/gha-reusable-workflows/.github/actions/setup-python-project@v0.5.0
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          enable-pip-cache: ${{ inputs.enable-pip-cache }}

      - name: Lint or compile
        env:
          RUFF_ARGS: ${{ inputs.ruff-args }}
        run: |
          set -euo pipefail
          if command -v ruff >/dev/null 2>&1; then
            # Word-split ruff-args intentionally
            # shellcheck disable=SC2086
            ruff check . ${RUFF_ARGS}
          elif [ -d src ]; then
            python -m compileall -q src
          else
            # Resilient fallback (e.g. samples/ trees without packaging metadata)
            python -m compileall -q .
          fi

      - name: Test
        id: pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          FAIL_FAST: ${{ inputs.fail-fast }}
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ] || compgen -G "test_*.py" >/dev/null || compgen -G "*_test.py" >/dev/null; then
            EXTRA=()
            if [ "${FAIL_FAST}" = "true" ]; then
              EXTRA+=(-x)
            fi
            # Word-split pytest-args intentionally (callers pass flags like -k 'name')
            # shellcheck disable=SC2086
            python -m pytest -q "${EXTRA[@]}" ${PYTEST_ARGS}
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tests found; skipping pytest"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Job summary
        if: always()
        id: meta
        env:
          PY_VER: ${{ inputs.python-version }}
          TESTS_RAN: ${{ steps.pytest.outputs.ran }}
          FAIL_FAST: ${{ inputs.fail-fast }}
          WD: ${{ inputs.working-directory }}
          PIP_CACHE: ${{ inputs.enable-pip-cache }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          set -euo pipefail
          echo "python-version=${PY_VER}" >> "$GITHUB_OUTPUT"
          echo "tests-ran=${TESTS_RAN:-false}" >> "$GITHUB_OUTPUT"
          {
            echo "## Python CI summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| working-directory | \`${WD}\` |"
            echo "| python-version | \`${PY_VER}\` |"
            echo "| tests-ran | \`${TESTS_RAN:-false}\` |"
            echo "| fail-fast | \`${FAIL_FAST}\` |"
            echo "| pip-cache | \`${PIP_CACHE}\` |"
            echo "| pytest-args | \`${PYTEST_ARGS:-}\` |"
            echo "| setup | composite setup-python-project |"
          } >> "$GITHUB_STEP_SUMMARY"
