name: Java Maven CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing pom.xml
        required: false
        type: string
        default: "."
      java-version:
        description: JDK version for Temurin
        required: false
        type: string
        default: "21"
      java-distribution:
        description: JDK distribution passed to setup-java (default temurin)
        required: false
        type: string
        default: "temurin"
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 30
      fail-fast:
        description: When true, stop Maven after the first test failure
        required: false
        type: boolean
        default: true
      enable-maven-cache:
        description: Enable Maven dependency cache via actions/setup-java
        required: false
        type: boolean
        default: true
      maven-goals:
        description: "Maven goals to run (default: test)"
        required: false
        type: string
        default: "test"
      maven-extra-args:
        description: Extra Maven CLI args after goals (e.g. -pl module -am -DskipITs)
        required: false
        type: string
        default: ""
      maven-opts:
        description: Value for MAVEN_OPTS (JVM flags for the Maven process; empty = unset)
        required: false
        type: string
        default: ""
      fetch-depth:
        description: actions/checkout fetch-depth (0 = full history)
        required: false
        type: number
        default: 1
    outputs:
      java-version:
        description: Resolved JDK version used for the job
        value: ${{ jobs.test.outputs.java-version }}
      maven-goals:
        description: Maven goals that were executed
        value: ${{ jobs.test.outputs.maven-goals }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      java-version: ${{ steps.meta.outputs.java-version }}
      maven-goals: ${{ steps.meta.outputs.maven-goals }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Maven project
        uses: rmkr-dev/gha-reusable-workflows/.github/actions/setup-maven-project@v0.4.2
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          working-directory: ${{ inputs.working-directory }}
          enable-maven-cache: ${{ inputs.enable-maven-cache }}

      - name: Test
        id: mvn
        env:
          GOALS: ${{ inputs.maven-goals }}
          EXTRA: ${{ inputs.maven-extra-args }}
          FAIL_FAST: ${{ inputs.fail-fast }}
          MAVEN_OPTS: ${{ inputs.maven-opts }}
        run: |
          set -euo pipefail
          # Word-split goals/extra intentionally so callers can pass "clean test" / "-pl m -am"
          # shellcheck disable=SC2086
          if [ "${FAIL_FAST}" = "true" ]; then
            mvn -B ${GOALS} ${EXTRA} -Dsurefire.skipAfterFailureCount=1
          else
            mvn -B ${GOALS} ${EXTRA}
          fi

      - name: Job summary
        if: always()
        id: meta
        env:
          JAVA_VER: ${{ inputs.java-version }}
          JAVA_DIST: ${{ inputs.java-distribution }}
          GOALS: ${{ inputs.maven-goals }}
          WD: ${{ inputs.working-directory }}
          FAIL_FAST: ${{ inputs.fail-fast }}
          MVN_CACHE: ${{ inputs.enable-maven-cache }}
          EXTRA: ${{ inputs.maven-extra-args }}
          MAVEN_OPTS_IN: ${{ inputs.maven-opts }}
        run: |
          set -euo pipefail
          echo "java-version=${JAVA_VER}" >> "$GITHUB_OUTPUT"
          echo "maven-goals=${GOALS}" >> "$GITHUB_OUTPUT"
          {
            echo "## Java Maven CI summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| working-directory | \`${WD}\` |"
            echo "| java-version | \`${JAVA_VER}\` |"
            echo "| java-distribution | \`${JAVA_DIST}\` |"
            echo "| maven-goals | \`${GOALS}\` |"
            echo "| maven-extra-args | \`${EXTRA:-}\` |"
            echo "| maven-opts | \`${MAVEN_OPTS_IN:-}\` |"
            echo "| fail-fast | \`${FAIL_FAST}\` |"
            echo "| maven-cache | \`${MVN_CACHE}\` |"
            echo "| setup | composite setup-maven-project |"
          } >> "$GITHUB_STEP_SUMMARY"
