name: Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Fail on findings at or above this severity (dependency-review-action)"
        required: false
        type: string
        default: "low"
      deny-licenses:
        description: "Comma-separated SPDX license identifiers to deny (empty = none)"
        required: false
        type: string
        default: ""
      comment-summary-in-pr:
        description: Post a dependency review summary comment on the PR
        required: false
        type: boolean
        default: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}

      - name: Job summary
        if: always()
        env:
          SEVERITY: ${{ inputs.fail-on-severity }}
          DENY: ${{ inputs.deny-licenses }}
          COMMENT: ${{ inputs.comment-summary-in-pr }}
        run: |
          set -euo pipefail
          {
            echo "## Dependency review summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| fail-on-severity | \`${SEVERITY}\` |"
            echo "| deny-licenses | \`${DENY:-}\` |"
            echo "| comment-summary-in-pr | \`${COMMENT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
