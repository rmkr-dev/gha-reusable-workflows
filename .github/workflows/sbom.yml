name: SBOM

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name for the uploaded SBOM artifact
        required: false
        type: string
        default: sbom
      path:
        description: Path to scan for the SBOM
        required: false
        type: string
        default: "."
      upload-artifact:
        description: Whether to upload the SPDX file as a workflow artifact
        required: false
        type: boolean
        default: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.path }}
          format: spdx-json
          artifact-name: ${{ inputs.artifact-name }}.spdx.json
          upload-artifact: ${{ inputs.upload-artifact }}
          upload-release-assets: false

      - name: Retention reminder
        if: inputs.upload-artifact
        run: |
          set -euo pipefail
          {
            echo "## SBOM artifact"
            echo ""
            echo "Uploaded \`${{ inputs.artifact-name }}.spdx.json\` (SPDX JSON)."
            echo "Retention follows this repository/org Actions artifact retention (GitHub default **90 days** unless customized)."
            echo "Download or attach to a Release if you need longer retention."
          } >> "$GITHUB_STEP_SUMMARY"
