name: Docker build

on:
  workflow_call:
    inputs:
      context:
        description: Build context path relative to the repository root
        required: false
        type: string
        default: "."
      file:
        description: Path to the Dockerfile relative to the repository root
        required: false
        type: string
        default: "Dockerfile"
      image-name:
        description: Image name without registry (used for local tags / summary)
        required: false
        type: string
        default: "app"
      tags:
        description: Comma-separated image tags (e.g. myorg/app:latest,myorg/app:sha)
        required: false
        type: string
        default: ""
      labels:
        description: Comma-separated OCI labels (key=value) passed to build-push-action
        required: false
        type: string
        default: ""
      annotations:
        description: Comma-separated OCI annotations (key=value) passed to build-push-action
        required: false
        type: string
        default: ""
      build-args:
        description: Comma-separated Docker build-args (KEY=VALUE) passed to build-push-action
        required: false
        type: string
        default: ""
      target:
        description: Optional multi-stage Dockerfile target name (empty = final stage)
        required: false
        type: string
        default: ""
      enable-gha-cache:
        description: Use GitHub Actions cache (type=gha) for buildx cache-from/cache-to
        required: false
        type: boolean
        default: true
      push:
        description: Push the image to a registry (default false — build-only / self-test safe)
        required: false
        type: boolean
        default: false
      platforms:
        description: Target platforms for buildx (single platform recommended when push=false)
        required: false
        type: string
        default: "linux/amd64"
      scan:
        description: Run Trivy vulnerability scan on the built image (free aquasecurity action)
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: Comma-separated severities that fail the scan when scan=true
        required: false
        type: string
        default: "CRITICAL,HIGH"
      trivy-ignore-unfixed:
        description: Pass ignore-unfixed to Trivy (default true)
        required: false
        type: boolean
        default: true
      trivy-exit-code:
        description: Trivy exit-code (1 fails the job on findings; 0 reports only)
        required: false
        type: string
        default: "1"
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 30
    outputs:
      image-name:
        description: Resolved image name used for local tags
        value: ${{ jobs.build.outputs.image-name }}
      pushed:
        description: Whether the image was pushed (true/false)
        value: ${{ jobs.build.outputs.pushed }}
      scanned:
        description: Whether Trivy ran (true/false)
        value: ${{ jobs.build.outputs.scanned }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      # packages:write only needed when callers push to ghcr; keep read-only by default
    outputs:
      image-name: ${{ steps.meta.outputs.image-name }}
      pushed: ${{ steps.meta.outputs.pushed }}
      scanned: ${{ steps.meta.outputs.scanned }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ${{ inputs.image-name }}
          TAGS_IN: ${{ inputs.tags }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [ -n "${TAGS_IN}" ]; then
            echo "tags=${TAGS_IN}" >> "$GITHUB_OUTPUT"
          else
            # Local-only tag when caller omits tags (safe for push=false self-tests)
            echo "tags=local/${IMAGE}:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and optionally push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          load: ${{ inputs.push == false }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ inputs.labels }}
          annotations: ${{ inputs.annotations }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          cache-from: ${{ inputs.enable-gha-cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.enable-gha-cache && 'type=gha,mode=max' || '' }}

      - name: Resolve scan image ref
        if: inputs.scan
        id: scanref
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Trivy expects a single image ref; use the first tag when several are listed
          echo "ref=${TAGS%%,*}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        if: inputs.scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: table
          exit-code: ${{ inputs.trivy-exit-code }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Job summary
        if: always()
        id: meta
        env:
          IMAGE: ${{ inputs.image-name }}
          TAGS: ${{ steps.tags.outputs.tags }}
          LABELS: ${{ inputs.labels }}
          ANNOTATIONS: ${{ inputs.annotations }}
          PUSH: ${{ inputs.push }}
          SCAN: ${{ inputs.scan }}
          CTX: ${{ inputs.context }}
          FILE: ${{ inputs.file }}
          TARGET: ${{ inputs.target }}
          GHA_CACHE: ${{ inputs.enable-gha-cache }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          # When multiple tags were provided, use the first for summary fields
          FIRST_TAG="${TAGS%%,*}"
          echo "image-name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "pushed=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "scanned=${SCAN}" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker build summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| context | \`${CTX}\` |"
            echo "| file | \`${FILE}\` |"
            echo "| image-name | \`${IMAGE}\` |"
            echo "| tags | \`${TAGS}\` |"
            echo "| labels | \`${LABELS:-}\` |"
            echo "| annotations | \`${ANNOTATIONS:-}\` |"
            echo "| build-args | \`${BUILD_ARGS:-}\` |"
            echo "| target | \`${TARGET:-}\` |"
            echo "| gha-cache | \`${GHA_CACHE}\` |"
            echo "| push | \`${PUSH}\` |"
            echo "| scan (Trivy) | \`${SCAN}\` |"
            echo "| primary-tag | \`${FIRST_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
