name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array of CodeQL languages, e.g. ["python"] or ["java-kotlin","python"]'
        required: true
        type: string
      working-directory:
        description: Optional subdirectory for analyzed project
        required: false
        type: string
        default: "."
      queries:
        description: Optional CodeQL queries pack / config (passed to codeql-action/init)
        required: false
        type: string
        default: ""
      build-mode:
        description: Optional CodeQL build-mode (e.g. none, autobuild); empty uses action default
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 360

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ inputs.working-directory }}
          queries: ${{ inputs.queries }}
          build-mode: ${{ inputs.build-mode }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
