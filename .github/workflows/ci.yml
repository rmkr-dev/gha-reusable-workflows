name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only — never cancel in-flight pushes to main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-sample:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: samples/python-hello
      python-version: "3.12"
      timeout-minutes: 20
      fail-fast: true
      enable-pip-cache: true

  python-requirements-dev-sample:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: samples/python-requirements-dev
      python-version: "3.12"
      timeout-minutes: 20
      fail-fast: true
      enable-pip-cache: true


  python-requirements-only-sample:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: samples/python-requirements-only
      python-version: "3.12"
      timeout-minutes: 20
      fail-fast: true
      enable-pip-cache: true

  python-compileall-only-sample:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: samples/python-compileall-only
      python-version: "3.12"
      timeout-minutes: 15
      fail-fast: true
      enable-pip-cache: false

  java-sample:
    uses: ./.github/workflows/java-maven-ci.yml
    with:
      working-directory: samples/java-hello
      java-version: "21"
      timeout-minutes: 20
      fail-fast: true
      enable-maven-cache: true
      maven-goals: test

  java-multi-sample:
    uses: ./.github/workflows/java-maven-ci.yml
    with:
      working-directory: samples/java-multi
      java-version: "21"
      timeout-minutes: 20
      fail-fast: true
      enable-maven-cache: true
      maven-goals: test

  docker-sample:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: samples/docker-hello
      file: samples/docker-hello/Dockerfile
      image-name: docker-hello
      tags: local/docker-hello:ci
      push: false
      scan: true
      trivy-severity: CRITICAL
      timeout-minutes: 20

  java-failsafe-sample:
    uses: ./.github/workflows/java-maven-ci.yml
    with:
      working-directory: samples/java-hello
      java-version: "21"
      timeout-minutes: 20
      fail-fast: true
      enable-maven-cache: true
      maven-goals: verify -Pintegration-test

  sbom-sample:
    uses: ./.github/workflows/sbom.yml
    with:
      path: samples/python-hello
      artifact-name: sbom-python-hello
      upload-artifact: true

  sbom-java-sample:
    uses: ./.github/workflows/sbom.yml
    with:
      path: samples/java-hello
      artifact-name: sbom-java-hello
      upload-artifact: true
      format: spdx-json
